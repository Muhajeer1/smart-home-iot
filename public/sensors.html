<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sensors</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="app-topbar">
        <div class="brand"><span class="brand-mark">IoT</span> Smart Home</div>
        <nav class="topnav">
          <a href="/dashboard">Dashboard</a>
          <a href="/devices">Devices</a>
          <a href="/analytics">Analytics</a>
          <a href="/alert-center">Alerts</a>
        </nav>
      </header>

      <section class="page-hero">
        <div>
          <p class="page-kicker">Sensor Layer</p>
          <h1>Sensors</h1>
          <p id="selectedDevice" class="meta"></p>
        </div>
      </section>

      <div class="layout-grid">
        <div>
          <div class="card">
            <h2>Default Sensors</h2>
            <p class="meta">
              Sensors are created automatically from the selected device type.
            </p>
            <button id="createDefaultSensorsBtn" type="button" hidden>
              Create Default Sensors
            </button>
            <p id="sensorMessage" class="message"></p>
          </div>

          <div class="card card-compact">
            <h2>Search</h2>
            <input id="sensorFilter" placeholder="Search sensor by type" />
          </div>
        </div>

        <div class="card">
          <h2>Sensors in this Device</h2>
          <ul id="sensorList"></ul>
        </div>
      </div>
    </div>

    <script src="/js/format.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/sensors.js"></script>
  </body>
</html>
