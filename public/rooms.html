<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rooms</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="app-topbar">
        <div class="brand"><span class="brand-mark">IoT</span> Smart Home</div>
        <nav class="topnav">
          <a href="/dashboard">Dashboard</a>
          <a href="/homes">Homes</a>
          <a href="/analytics">Analytics</a>
          <a href="/alert-center">Alerts</a>
        </nav>
      </header>

      <section class="page-hero">
        <div>
          <p class="page-kicker">Room Management</p>
          <h1>Rooms</h1>
          <p id="selectedHome" class="meta"></p>
        </div>
      </section>

      <div class="layout-grid">
        <div>
          <div class="card">
            <h2>Add Room</h2>
            <form id="roomForm">
              <input name="room_name" placeholder="Room Name" required />
              <input type="number" name="floor_no" placeholder="Floor Number" required />
              <button type="submit">Add Room</button>
            </form>
            <p id="roomMessage" class="message"></p>
          </div>

          <div class="card card-compact">
            <h2>Search</h2>
            <input id="roomFilter" placeholder="Search room by name" />
          </div>
        </div>

        <div class="card">
          <h2>Rooms in this Home</h2>
          <ul id="roomList"></ul>
        </div>
      </div>
    </div>

    <script src="/js/format.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/rooms.js"></script>
  </body>
</html>
