<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sensor Readings</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="app-topbar">
        <div class="brand"><span class="brand-mark">IoT</span> Smart Home</div>
        <nav class="topnav">
          <a href="/dashboard">Dashboard</a>
          <a href="/sensors">Sensors</a>
          <a href="/analytics">Analytics</a>
          <a href="/alert-center">Alerts</a>
        </nav>
      </header>

      <section class="page-hero">
        <div>
          <p class="page-kicker">Time Series Data</p>
          <h1>Sensor Readings</h1>
          <p id="selectedSensor" class="meta"></p>
        </div>
      </section>

      <div class="layout-grid">
        <div>
          <div class="card" id="simulatorPanel">
            <h2>IoT Reading Simulator</h2>
            <p class="meta" id="simulatorHint">
              Real devices are not connected in this demo. Readings are generated by the system simulator.
            </p>
            <button id="simulateReadingBtn" type="button">Generate Simulated Reading</button>
            <p id="readingMessage" class="message"></p>
          </div>

          <div class="card card-compact">
            <h2>Filter</h2>
            <input id="readingFilter" placeholder="Filter by quality flag" />
          </div>
        </div>

        <div class="card">
          <h2>Readings for this Sensor</h2>
          <div class="card-actions">
            <button id="toggleReadingList" type="button" class="btn-secondary">Hide Readings</button>
          </div>
          <ul id="readingList"></ul>
        </div>
      </div>
    </div>

    <script src="/js/format.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/readings.js"></script>
  </body>
</html>
